plugins { id 'com.android.application' }

def signingReady = System.getenv('APEX_KEYSTORE') != null
android {
    namespace 'com.apexelectriccycles.app'
    compileSdk 36
    defaultConfig {
        applicationId 'com.apexelectriccycles.app'
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
    }
    signingConfigs {
        if (signingReady) {
            release {
                storeFile file(System.getenv('APEX_KEYSTORE'))
                storePassword System.getenv('APEX_STORE_PASSWORD')
                keyAlias System.getenv('APEX_KEY_ALIAS')
                keyPassword System.getenv('APEX_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (signingReady) signingConfig signingConfigs.release
        }
    }
}
dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.7.4'
}
